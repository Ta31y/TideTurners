<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ocean Cleanup VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 2D HUD (desktop only, VR will ignore) -->
    <div class="hud">
      <div class="panel">
        <div class="title" id="levelTitle">—</div>
        <div id="timerLabel">–:–</div>
        <div id="totalScoreLabel">Total collected: 0</div>
        <div class="tip">
          Desktop: click to start · VR: use both controllers
        </div>
      </div>
    </div>

    <!-- hidden info dialog (desktop) -->
    <div id="info" class="dialog hidden">
      <div class="dialog-box">
        <div id="infoText">Info</div>
        <button id="infoBtn" class="clickable">Next</button>
      </div>
    </div>

    <a-scene
      id="scene"
      renderer="antialias: true"
      xr-mode-ui="enabled: true"
      webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
      background="color: #6cacbb"
    >
      <!-- ================================================================== -->
      <!-- Assets (image + audio + GLB models)                                -->
      <!-- Put your .glb files in /models as shown below                      -->
      <!-- ================================================================== -->
      <a-assets>
        <!-- existing -->
        <img id="turtleImg" src="images/turtle.jpg" crossorigin="anonymous" />
        <audio
          id="underwaterSnd"
          src="sounds/UnderwaterSounds.mp3"
          preload="auto"
        ></audio>

        <!-- TRASH (collectable) -->
        <a-asset-item
          id="mdlBottle"
          src="assets/models/water_bottle_free.glb"
        ></a-asset-item>
        <a-asset-item
          id="mdlCan"
          src="assets/models/soda_can.glb"
        ></a-asset-item>
        <a-asset-item
          id="mdlBag"
          src="assets/models/garbage_bag_white_lowpoly.glb"
        ></a-asset-item>

        <!-- AMBIENT (non-collectable) -->
        <a-asset-item
          id="mdlJelly"
          src="assets/models/exotic_blue_jellyfish.glb"
        ></a-asset-item>
        <a-asset-item
          id="mdlFish"
          src="assets/models/futuristic_bioluminescent_fish.glb"
        ></a-asset-item>
        <a-asset-item
          id="mdlPlant"
          src="assets/models/lowpoly_marine_plant.glb"
        ></a-asset-item>
        <a-asset-item
          id="mdlSeaTurtle"
          src="assets/models/low_poly_logger_head_turtle.glb"
        ></a-asset-item>
      </a-assets>

      <!-- global sky -->
      <a-sky id="sky" color="#6cacbb"></a-sky>

      <!-- BEACH (start) -->
      <a-entity id="beachEnv">
        <a-plane
          rotation="-90 0 0"
          width="200"
          height="200"
          position="0 -1 0"
          material="color:#E8C99B"
        ></a-plane>
        <a-plane
          rotation="-90 0 0"
          width="200"
          height="200"
          position="0 -1 -20"
          material="color:#5db8ff"
        ></a-plane>
      </a-entity>

      <!-- UNDERWATER -->
      <a-entity id="underwaterEnv" visible="false">
        <a-entity
          light="type: ambient; intensity: 0.45; color: #7fd0ff"
        ></a-entity>
        <a-entity
          light="type: directional; intensity: 0.65; color: #bfe9ff"
          position="0 6 -3"
        ></a-entity>
        <a-plane
          rotation="-90 0 0"
          width="120"
          height="120"
          position="0 -1.1 0"
          material="color:#d9c79c"
        ></a-plane>
        <a-entity id="spawner"></a-entity>

        <!-- 3D HUD in VR -->
        <a-entity
          id="vrHud"
          position="0 0 -1.3"
          text="value: ; align: center; width: 2.5; color: #fff"
          visible="false"
        ></a-entity>
      </a-entity>

      <!-- PLAYER RIG -->
      <a-entity id="rig" position="0 1.6 6" hand-vr-sync quest-move>
        <a-entity id="camera" camera look-controls></a-entity>

        <!-- hands hidden until game starts -->
        <a-box
          id="leftHand"
          depth="0.12"
          height="0.08"
          width="0.18"
          position="-0.25 -0.15 -0.5"
          color="#f3d2a2"
          visible="false"
          shadow="cast:false; receive:false"
        ></a-box>

        <a-entity
          id="rightHand"
          position="0.25 -0.15 -0.5"
          visible="false"
          shadow="cast:false; receive:false"
        >
          <a-box
            depth="0.12"
            height="0.08"
            width="0.18"
            color="#f3d2a2"
            shadow="cast:false; receive:false"
          ></a-box>
          <a-entity
            id="net"
            position="0 -0.02 -0.18"
            net-collector="radius: 0.45; score3D: #score3D"
            net-boost
            shadow="cast:false; receive:false"
          >
            <a-ring
              radius-inner="0.26"
              radius-outer="0.28"
              material="wireframe:true; color:#fff"
            ></a-ring>
            <a-cylinder
              position="0 -0.18 0.06"
              radius="0.02"
              height="0.35"
              color="#c1c1c1"
            ></a-cylinder>
          </a-entity>
        </a-entity>

        <!-- Start panel (turtle image + button) -->
        <a-entity id="startPanel" position="0 0 -1.5" visible="true">
          <a-plane
            width="1.8"
            height="1.0125"
            material="shader: flat; src: #turtleImg; side:double"
            radius="0.06"
          ></a-plane>
          <a-plane
            position="0 -0.8 0"
            width="1.2"
            height="0.3"
            color="#0b2230"
            opacity="0.9"
            radius="0.05"
            class="clickable"
          ></a-plane>
          <a-entity
            id="startText"
            position="0 -0.8 0.01"
            text="value: Klik om te beginnen; align: center; width: 2; color: #fff"
          ></a-entity>
        </a-entity>
      </a-entity>

      <!-- controllers -->
      <a-entity
        id="leftController"
        oculus-touch-controls="hand: left"
      ></a-entity>
      <a-entity
        id="rightController"
        oculus-touch-controls="hand: right"
      ></a-entity>

      <!-- floating score (in world) -->
      <a-entity
        id="score3D"
        text="value: Trash: 0; align: center; color: white; width: 2"
        position="0 0.6 -1.4"
        visible="false"
      ></a-entity>

      <!-- background audio -->
      <a-entity
        sound="src: #underwaterSnd; autoplay: true; loop: true; volume: 65"
      ></a-entity>
    </a-scene>

    <script src="game.js"></script>
  </body>
</html>
