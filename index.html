<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ocean Cleanup (VR + Desktop)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- tiny CSS here so HUD doesn’t block clicks -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .hud {
        position: fixed;
        top: 0;
        right: 0;
        padding: 1rem;
        z-index: 5;
        pointer-events: none; /* IMPORTANT: let A-Frame canvas still receive clicks */
      }
      .hud .panel {
        background: rgba(5, 29, 34, 0.8);
        color: #fff;
        border-radius: 0 0 0 1rem;
        padding: 0.6rem 1rem 0.8rem;
        min-width: 210px;
      }
      .hud .title {
        font-weight: 700;
        margin-bottom: 0.25rem;
      }
      .hud .tip {
        font-size: 0.65rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- desktop HUD -->
    <div class="hud">
      <div class="panel">
        <div class="title" id="levelTitle">—</div>
        <div id="timerLabel">–:–</div>
        <div id="totalScoreLabel">Total collected: 0</div>
        <div class="tip">Desktop: click anywhere to start · VR: pull trigger</div>
      </div>
    </div>

    <a-scene
      id="scene"
      renderer="antialias: true"
      webxr="optionalFeatures: local-floor, hand-tracking"
      background="color: #6cacbb"
    >
      <!-- a bit of light so nothing is black -->
      <a-entity light="type: ambient; intensity: 0.7; color: #fff"></a-entity>

      <!-- global sky -->
      <a-sky id="sky" color="#6cacbb"></a-sky>

      <!-- beach placeholder (start) -->
      <a-entity id="beachEnv">
        <a-plane rotation="-90 0 0" width="80" height="80" material="color:#e8d7a6"></a-plane>
        <a-plane rotation="-90 0 0" width="80" height="80" position="0 0 -10" material="color:#5db8ff"></a-plane>
      </a-entity>

      <!-- underwater scene -->
      <a-entity
        id="underwaterEnv"
        visible="false"
        fog="type: exponential; color: #0a3d62; density: 0.045"
      >
        <a-entity light="type: ambient; intensity: 0.45; color: #7fd0ff"></a-entity>
        <a-entity light="type: directional; intensity: 0.65; color: #bfe9ff" position="0 6 -3"></a-entity>
        <a-plane
          rotation="-90 0 0"
          width="120"
          height="120"
          position="0 -1.1 0"
          material="color:#d9c79c"
        ></a-plane>
        <!-- where trash is spawned -->
        <a-entity id="spawner"></a-entity>
        <!-- 3D score for VR -->
        <a-entity
          id="score3D"
          text="value: Trash: 0; color: white; align: center; width: 2"
          position="0 0.6 -1.4"
        ></a-entity>
      </a-entity>

      <!-- PLAYER RIG -->
      <a-entity
        id="rig"
        position="0 1.6 0"
        look-controls
        simple-drift="speed: 0"
        vr-swim
        hand-vr-sync
      >
        <a-entity camera></a-entity>

        <!-- 3D START PANEL (child of rig = always in front) -->
        <a-entity id="startPanel" position="0 0 -1.5" visible="true">
          <a-plane
            id="startPlane"
            class="clickable"
            width="1.9"
            height="1"
            color="#ffffff"
            material="shader: flat"
            radius="0.08"
          ></a-plane>
          <a-entity
            text="value: 🐢 Help me clean the ocean!\nKlik / trigger om te starten; align: center; color: #163344; width: 1.6"
            position="0 0 0.01"
          ></a-entity>
        </a-entity>

        <!-- 3D INFO PANEL (also on rig) -->
        <a-entity id="infoPanel" position="0 0 -1.5" visible="false">
          <a-plane width="2.4" height="1.5" color="#ffffff" radius="0.08"></a-plane>
          <a-entity
            id="infoPanelText"
            position="0 0.35 0.01"
            text="value: info; align: center; color: #163344; width: 2.1"
          ></a-entity>
          <a-entity
            id="infoPanelBtn"
            class="clickable"
            geometry="primitive: plane; width: 0.55; height: 0.2"
            material="color: #1673ff; shader: flat"
            position="0 -0.55 0.02"
            text="value: Next; align: center; color: #fff; width: 1"
          ></a-entity>
        </a-entity>

        <!-- default hands (will move onto controllers in VR) -->
        <a-box
          id="leftHand"
          visible="false"
          depth="0.12"
          height="0.08"
          width="0.18"
          position="-0.25 -0.15 -0.5"
          color="#f3d2a2"
        ></a-box>

        <a-entity id="rightHand" visible="false" position="0.25 -0.15 -0.5">
          <a-box depth="0.12" height="0.08" width="0.18" color="#f3d2a2"></a-box>
          <a-entity
            id="net"
            position="0 -0.02 -0.18"
            net-collector="radius: 0.5; score3D: #score3D"
            net-boost
          >
            <a-ring radius-inner="0.26" radius-outer="0.28" material="wireframe:true; color:#fff"></a-ring>
            <a-cylinder position="0 -0.18 0.06" radius="0.02" height="0.35" color="#c1c1c1"></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- turtle -->
      <a-entity id="turtle" turtle-guide="offset: -0.4 0 -1.2">
        <a-sphere radius="0.18" color="#4caf50"></a-sphere>
      </a-entity>

      <!-- QUEST 2 controllers -->
      <a-entity id="leftController" oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
      <a-entity id="rightController" oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>

      <!-- game root -->
      <a-entity game-manager></a-entity>
    </a-scene>

    <script src="game.js"></script>
  </body>
</html>
