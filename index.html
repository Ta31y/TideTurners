<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ocean Cleanup VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- A-Frame extras: gives us VR thumbstick movement -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HUD (desktop only) -->
    <div class="hud" id="hud">
      <div class="panel">
        <div class="title" id="levelTitle">Beach</div>
        <div id="timerLabel">–:–</div>
        <div id="totalScoreLabel">Total collected: 0</div>
        <div class="tip">PC: mouse + WASD · VR: thumbstick + trigger</div>
      </div>
    </div>

    <!-- Desktop dialog (for when NOT in headset) -->
    <div id="dialog" class="dialog">
      <div class="dialog-box">
        <div id="dialogText">🐢 Please come help me clean the ocean!</div>
        <button id="dialogBtn">Yes, I’ll help!</button>
      </div>
    </div>

    <!-- Desktop info dialog -->
    <div id="info" class="dialog hidden">
      <div class="dialog-box">
        <div id="infoText">Info</div>
        <button id="infoBtn">Next</button>
      </div>
    </div>

    <!-- SCENE -->
    <a-scene
      id="scene"
      renderer="antialias: true"
      webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
      background="color: #0a3d62"
      fog="type: exponential; color: #0a3d62; density: 0.045"
    >
      <!-- global sky -->
      <a-sky id="sky" color="#6cacbb"></a-sky>

      <!-- beach (only shown before level 1) -->
      <a-entity id="beachEnv">
        <a-plane
          rotation="-90 0 0"
          width="80"
          height="80"
          position="0 0 0"
          material="color:#e8d7a6"
        ></a-plane>
        <a-plane
          rotation="-90 0 0"
          width="80"
          height="80"
          position="0 0 -20"
          material="color:#5db8ff"
        ></a-plane>
      </a-entity>

      <!-- underwater -->
      <a-entity id="underwaterEnv" visible="false">
        <!-- lights stay THE SAME every level so trash is visible -->
        <a-entity
          light="type: ambient; intensity: 0.45; color: #7fd0ff"
        ></a-entity>
        <a-entity
          light="type: directional; intensity: 0.65; color: #bfe9ff"
          position="0 6 -3"
        ></a-entity>

        <!-- seabed -->
        <a-plane
          rotation="-90 0 0"
          width="120"
          height="120"
          position="0 -1.1 0"
          material="color:#d9c79c"
        ></a-plane>

        <!-- where trash spawns -->
        <a-entity id="spawner"></a-entity>

        <!-- small 3d score -->
        <a-entity
          id="score3D"
          text="value: Trash: 0; align: center; color: white; width: 2"
          position="0 0.6 -1.4"
        ></a-entity>
      </a-entity>

      <!-- PLAYER RIG -->
      <!-- movement-controls = works on Quest thumbsticks out of the box -->
      <a-entity
        id="rig"
        position="0 1.6 8"
        movement-controls="fly: true"
        hand-vr-sync
      >
        <!-- camera -->
        <a-entity camera look-controls="pointerLockEnabled: true"></a-entity>

        <!-- DESKTOP hands (we attach to controllers in VR) -->
        <a-box
          id="leftHand"
          visible="false"
          depth="0.12"
          height="0.08"
          width="0.18"
          position="-0.25 -0.15 -0.5"
          color="#f3d2a2"
        ></a-box>

        <a-entity id="rightHand" visible="false" position="0.25 -0.15 -0.5">
          <a-box
            depth="0.12"
            height="0.08"
            width="0.18"
            color="#f3d2a2"
          ></a-box>
          <a-entity
            id="net"
            position="0 -0.02 -0.18"
            net-collector="radius: 0.5; score3D: #score3D"
            net-boost
          >
            <a-ring
              radius-inner="0.26"
              radius-outer="0.28"
              material="wireframe:true; color:#fff"
            ></a-ring>
            <a-cylinder
              position="0 -0.18 0.06"
              radius="0.02"
              height="0.35"
              color="#c1c1c1"
            ></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- VR CONTROLLERS (Quest 2) -->
      <a-entity
        id="leftController"
        oculus-touch-controls="hand: left"
      ></a-entity>
      <a-entity
        id="rightController"
        oculus-touch-controls="hand: right"
        raycaster="objects: .vr-clickable"
        line="color: white; opacity: 0.9"
      ></a-entity>

      <!-- TURTLE -->
      <a-entity id="turtle" turtle-guide="offset: -0.4 0 -1.2">
        <a-sphere radius="0.18" color="#4caf50"></a-sphere>
        <a-box
          depth="0.35"
          height="0.1"
          width="0.25"
          color="#2e7d32"
          position="0 0 -0.08"
        ></a-box>
        <a-entity
          text="value: Guide; color: white; align: center; width: 2"
          position="0 0.4 0"
        ></a-entity>
      </a-entity>

      <!-- VR START PANEL (so you can start the game INSIDE VR) -->
      <a-entity id="vrStart" position="0 1.6 -1.8" visible="true">
        <a-plane
          width="1.4"
          height="0.7"
          color="#ffffff"
          opacity="0.92"
          class="vr-clickable"
          id="vrStartBtn"
        ></a-plane>
        <a-entity
          text="value: 🐢 Help me clean the ocean!; align: center; color: #000; width: 1.6"
          position="0 0.18 0.01"
        ></a-entity>
        <a-entity
          text="value: Point ray and click trigger to start; align: center; color: #0074ff; width: 1.4"
          position="0 -0.12 0.01"
        ></a-entity>
      </a-entity>

      <!-- GAME MANAGER -->
      <a-entity id="game" game-manager></a-entity>
    </a-scene>

    <script src="game.js"></script>
  </body>
</html>
